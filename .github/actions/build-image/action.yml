name: Build image for one platform
description: >-
  Builds one image for one platform on a runner of that architecture, without emulation
  (ADR 0049), pushes it to GHCR by digest only (no tag), and uploads the digest as the artifact
  digests-<image>-<arch> for the job that joins the platforms under the release tags.
inputs:
  image:
    description: server or landing
    required: true
  arch:
    description: amd64 or arm64, the runner's own architecture
    required: true
  build-contexts:
    description: Extra build contexts, as for docker/build-push-action
    required: false
    default: ''
  token:
    description: Token that may push packages
    required: true
runs:
  using: composite
  steps:
    - id: name
      shell: bash
      run: echo "image=ghcr.io/$GITHUB_REPOSITORY_OWNER/$NAME" >> "$GITHUB_OUTPUT"
      env:
        NAME: ${{ inputs.image == 'server' && 'scholarly-mcp' || 'scholarly-mcp-landing' }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ steps.name.outputs.image }}
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/${{ inputs.image }}/Dockerfile
        build-contexts: ${{ inputs.build-contexts }}
        platforms: linux/${{ inputs.arch }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ inputs.image }}-${{ inputs.arch }}
        cache-to: type=gha,scope=${{ inputs.image }}-${{ inputs.arch }},mode=max
    - shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digests-${{ inputs.image }}-${{ inputs.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
