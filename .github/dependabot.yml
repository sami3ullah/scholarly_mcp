# Dependency updates (SM-14). Weekly, grouped so a week's updates arrive as a few PRs; each
# runs CI, the E2E smoke test and the security scans before it is merged. A cooldown leaves
# fresh releases a week to be pulled or fixed before they are proposed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directories: [/docker/server, /docker/landing]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ['*']
    commit-message:
      prefix: build(docker)

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(docker)
