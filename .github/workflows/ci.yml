name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The embedder tests load the real model; key on the pinned revisions in model.ts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: models-${{ hashFiles('packages/embedder-onnx/src/model.ts') }}-q8
      # The card view's test renders it in Chromium through the MCP Apps host bridge.
      - run: pnpm --filter @scholarly-mcp/card-view exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test:coverage

  # The landing page end to end (ADR 0032): Playwright with axe and Lighthouse CI, against a
  # stub landing API with synthetic articles, so no index or content is needed here.
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @scholarly-mcp/landing build
      - run: pnpm --filter @scholarly-mcp/landing exec playwright install --with-deps chromium
      - run: pnpm --filter @scholarly-mcp/landing e2e
      - run: pnpm --filter @scholarly-mcp/landing lhci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-reports
          path: |
            apps/landing/playwright-report
            apps/landing/test-results
            apps/landing/.lighthouseci

  # End to end (SM-14): both images with the demo index (ADR 0039) baked in, the compose stack
  # on SQLite and then on Postgres, each with the landing app, and every tool over HTTP.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No pnpm here: the smoke test needs only Node.
          package-manager-cache: false
      # Cached per week and per input (ADR 0049); a cache miss builds it from the APIs.
      - uses: ./.github/actions/demo-index
        with:
          path: ${{ runner.temp }}/demo-index
          crossref-mailto: ${{ vars.CROSSREF_MAILTO }}
      - run: docker/e2e/smoke.sh sqlite
        env:
          SMOKE_INDEX_DIR: ${{ runner.temp }}/demo-index
      - run: docker/e2e/smoke.sh postgres
        env:
          SMOKE_INDEX_DIR: ${{ runner.temp }}/demo-index
      # The self-hosting bundle (ADR 0045) on the images built above, over HTTPS via Caddy.
      - run: docker/e2e/deploy-smoke.sh sqlite
      - run: docker/e2e/deploy-smoke.sh postgres
