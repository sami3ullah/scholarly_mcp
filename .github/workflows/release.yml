name: Release

# A version tag (v1.2.3) publishes both images to GHCR for amd64 and arm64, each with an SPDX
# SBOM and build provenance, and a GitHub release carrying the SBOMs (SM-14). The server
# image carries only the demo index (ADR 0039), built from Crossref and Europe PMC and checked
# for CC BY 4.0, and is smoke-tested end to end before anything is pushed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo-index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Demo index
        run: |
          docker build -q -f docker/server/Dockerfile -t scholarly-mcp:local .
          docker/demo-index/build.sh "$RUNNER_TEMP/demo-index"
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
      - name: Smoke test on SQLite and Postgres
        run: |
          docker/e2e/smoke.sh sqlite
          docker/e2e/smoke.sh postgres
        env:
          SMOKE_INDEX_DIR: ${{ runner.temp }}/demo-index
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-index
          path: ${{ runner.temp }}/demo-index/index.sqlite
          retention-days: 7

  publish:
    needs: demo-index
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, landing]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image == 'server' && 'scholarly-mcp' || 'scholarly-mcp-landing' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: matrix.image == 'server'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: demo-index
          path: ${{ runner.temp }}/demo-index
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          build-contexts: ${{ matrix.image == 'server' && format('index={0}/demo-index', runner.temp) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          output-file: sbom-${{ matrix.image }}.spdx.json
      - name: Attach the SBOM to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "sbom-${{ matrix.image }}.spdx.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
