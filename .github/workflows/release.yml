name: Release

# A version tag (v1.2.3) publishes both images to GHCR for amd64 and arm64, each with an SPDX
# SBOM and build provenance, and a GitHub release carrying the SBOMs (SM-14). The server
# image carries only the demo index (ADR 0039), checked for CC BY 4.0.
#
# Laid out for speed (ADR 0049): the demo index comes from the Actions cache; each platform
# builds natively on its own runner, all four builds at once; the landing image does not wait
# for the index. Nothing is tagged until CI has passed on the tagged commit, which is where
# the end-to-end smoke tests run, so tag a commit that was pushed to main.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
    steps:
      - name: Wait for CI
        run: |
          for attempt in $(seq 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[0] | if . == null then "none" elif .status != "completed" then "pending" else .conclusion end')
            case "$state" in
              success) echo "CI passed on $GITHUB_SHA"; exit 0 ;;
              none)
                if [ "$attempt" -ge 6 ]; then
                  echo "::error::No CI run for $GITHUB_SHA. Tag a commit that was pushed to main on its own."
                  exit 1
                fi ;;
              pending) ;;
              *) echo "::error::CI on $GITHUB_SHA ended in '$state'"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  demo-index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/demo-index
        with:
          path: ${{ runner.temp }}/demo-index
          crossref-mailto: ${{ vars.CROSSREF_MAILTO }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-index
          path: ${{ runner.temp }}/demo-index/index.sqlite
          if-no-files-found: error
          retention-days: 7

  build-server:
    needs: demo-index
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-index
          path: ${{ runner.temp }}/demo-index
      - uses: ./.github/actions/build-image
        with:
          image: server
          arch: ${{ matrix.arch }}
          build-contexts: index=${{ runner.temp }}/demo-index
          token: ${{ secrets.GITHUB_TOKEN }}

  build-landing:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-image
        with:
          image: landing
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Joins the two platforms of each image under the release tags, then attests and attaches
  # the SBOM. Only after CI passed, so a failing commit never gets a version or `latest`.
  publish:
    needs: [ci, build-server, build-landing]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, landing]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image == 'server' && 'scholarly-mcp' || 'scholarly-mcp-landing' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: manifest
        name: Tag both platforms as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          count=${#digests[@]}
          if [ "$count" != 2 ]; then echo "::error::Expected 2 platform digests, found $count"; exit 1; fi
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "${digests[@]/#/$IMAGE@sha256:}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          output-file: sbom-${{ matrix.image }}.spdx.json
      - name: Attach the SBOM to the release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "sbom-${{ matrix.image }}.spdx.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
