name: Demo index

# Builds the week's demo index early on Monday (ADR 0049), so CI and releases restore it from
# the cache instead of waiting 10-30 minutes on Crossref and Europe PMC. It also runs the
# CC BY 4.0 licence check (ADR 0039) every week, so a licence that changes upstream fails here,
# not in a release. A cache entry made on the default branch is readable from every branch,
# pull request and tag.
on:
  schedule:
    - cron: '7 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/demo-index
        with:
          path: ${{ runner.temp }}/demo-index
          crossref-mailto: ${{ vars.CROSSREF_MAILTO }}
